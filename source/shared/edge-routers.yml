---
paths:
  enumerated-router-capabilities:
    get:
      summary: Returns all router capabilities this version of the controller is aware of
      security:
        - ztSession: [ ]
        - oauth2: [ openid ]
      tags:
        - Informational
      operationId: listEnumeratedRouterCapabilities
      responses:
        '200':
          $ref: '#/responses/listEnumeratedRouterCapabilities'
        '401':
          $ref: 'standard-responses.yml#/responses/unauthorizedResponse'
        '429':
          $ref: 'standard-responses.yml#/responses/rateLimitedResponse'
        '503':
          $ref: 'standard-responses.yml#/responses/serverUnavailableResponse'
responses:
  listEnumeratedRouterCapabilities:
    description: A typed and enumerated list of router capabilities
    headers:
      WWW-Authenticate:
        description: "Denotes different type of security token related information"
        type: array
        items:
          type: string
    schema:
      $ref: '#/definitions/listEnumeratedRouterCapabilitiesEnvelope'
definitions:
  listEnumeratedRouterCapabilitiesEnvelope:
    type: object
    required:
      - meta
      - data
    properties:
      meta:
        $ref: 'standard-responses.yml#/definitions/meta'
      data:
        type: array
        items:
          $ref: '#/definitions/routerCapabilities'
  routerCapabilities:
    type: string
    enum:
      - MULTI_CHANNEL
      - SERVICE_SUBSCRIPTIONS
      - CONNECT_V2
      - POSTURE_CHECKS
      - BIND_SUCCESS
  serviceEdgeRouters:
    type: object
    properties:
        edgeRouters:
          type: array
          items:
            $ref: '#/definitions/commonEdgeRouterProperties'
  commonEdgeRouterProperties:
    type: object
    required:
      - hostname
      - name
      - supportedProtocols
      - syncStatus
      - isOnline
      - cost
      - noTraversal
      - disabled
    properties:
      hostname:
        type: string
      name:
        type: string
      supportedProtocols:
        additionalProperties:
          type: string
        type: object
      syncStatus:
        type: string
      isOnline:
        type: boolean
      cost:
        type: integer
        minimum: 0
        maximum: 65535
        x-nullable: true
      noTraversal:
        type: boolean
        x-nullable: true
      disabled:
        type: boolean
      capabilities:
        description: >
          Capabilities this edge router advertises, used by SDK clients to
          select a router that supports a given feature before connecting.
          Open-ended: clients ignore values they do not recognize. Absent when
          the controller predates this field.
        type: array
        items:
          type: string
      version:
        description: >
          The version of the edge router binary, as reported to the controller
          when the router connects. Empty when the controller has not yet
          received a version from the router or predates this field.
        type: string
      appData:
        $ref: 'base-entity.yml#/definitions/tags'
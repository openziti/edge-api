---
definitions:
  serviceEdgeRouters:
    type: object
    properties:
        edgeRouters:
          type: array
          items:
            $ref: '#/definitions/commonEdgeRouterProperties'
  commonEdgeRouterProperties:
    type: object
    required:
      - hostname
      - name
      - supportedProtocols
      - syncStatus
      - isOnline
      - cost
      - noTraversal
      - disabled
    properties:
      hostname:
        type: string
      name:
        type: string
      supportedProtocols:
        additionalProperties:
          type: string
        type: object
      syncStatus:
        type: string
      isOnline:
        type: boolean
      cost:
        type: integer
        minimum: 0
        maximum: 65535
        x-nullable: true
      noTraversal:
        type: boolean
        x-nullable: true
      disabled:
        type: boolean
      capabilities:
        description: >
          Capabilities this edge router advertises, used by SDK clients to
          select a router that supports a given feature before connecting.
          Open-ended: clients ignore values they do not recognize. Absent when
          the controller predates this field.
        type: array
        items:
          type: string
      appData:
        $ref: 'base-entity.yml#/definitions/tags'